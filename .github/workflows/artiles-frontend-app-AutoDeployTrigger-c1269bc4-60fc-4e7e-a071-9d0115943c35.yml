name: Trigger auto deployment for artiles-frontend-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/artiles-frontend-app-AutoDeployTrigger-c1269bc4-60fc-4e7e-a071-9d0115943c35.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARTILESFRONTENDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ARTILESFRONTENDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ARTILESFRONTENDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ARTILESFRONTENDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ARTILESFRONTENDAPP_REGISTRY_PASSWORD }}
          containerAppName: artiles-frontend-app
          resourceGroup: RG1
          imageToBuild: antred1/artiles-frontend-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


